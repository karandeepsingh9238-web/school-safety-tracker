<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Safety Tracker</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>School Safety Tracker</h1>
        <p>Live Student Safety Dashboard - Version 1</p>
    </header>

    <main class="dashboard">

        <div class="card">
            <h2>Total Students</h2>
            <p class="number">500</p>
        </div>

        <div class="card">
            <h2>Inside School</h2>
            <p class="number" id="insideCount">462</p>
        </div>

        <div class="card">
            <h2>Released</h2>
            <p class="number">28</p>
        </div>

        <div class="card">
            <h2>Safety Alerts</h2>
            <p class="number">0</p>
        </div>

    </main>

    <section class="controls">

        <h2>Gate Simulation</h2>

        <button id="enterBtn">
            Student Enter
        </button>

        <button id="exitBtn">
            Student Exit
        </button>

    </section>

    <script src="script.js"></script>

</body>

</html>
