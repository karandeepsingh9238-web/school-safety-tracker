<!DOCTYPE html>
<html>
<head>
    <title>School Safety Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>School Safety Tracker</h1>
        <p>Live Student Safety Dashboard - Version 1</p>
    </header>

    <main class="dashboard">

        <div class="card">
            <h2>Total Students</h2>
            <p class="number">500</p>
        </div>

        <div class="card">
            <h2>Inside School</h2>
            <p class="number">462</p>
        </div>

        <div class="card">
            <h2>Released</h2>
            <p class="number">28</p>
        </div>

        <div class="card">
            <h2>Safety Alerts</h2>
            <p class="number">0</p>
        </div>

    </main>

</body>
</html>
